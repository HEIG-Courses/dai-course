<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Helvetica, Arial, sans-serif">
  <title>Each Dockerfile instruction creates one image layer</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#445"/>
    </marker>
    <style>
      .layer { fill: #3b6ea8; stroke: #2c5580; stroke-width: 1.2; }
      .code  { font-family: Menlo, Consolas, monospace; font-size: 16px; fill: #222; }
      .lab   { font-family: Menlo, Consolas, monospace; font-size: 14px; fill: #ffffff; }
      .size  { font-family: Menlo, Consolas, monospace; font-size: 14px; fill: #cfe0f2; }
      .edge  { stroke: #445; stroke-width: 1.5; fill: none; marker-end: url(#a); }
      .note  { font-size: 13px; fill: #666; font-style: italic; }
    </style>
  </defs>

  <text x="20" y="46"  class="code">FROM alpine:3.24</text>
  <text x="20" y="96"  class="code">WORKDIR /app</text>
  <text x="20" y="146" class="code">COPY app.txt .</text>
  <text x="20" y="196" class="code">RUN mkdir /data</text>
  <text x="20" y="246" class="code">ENTRYPOINT ["cat", "app.txt"]</text>

  <path d="M330,41  H466" class="edge"/>
  <path d="M330,91  H466" class="edge"/>
  <path d="M330,141 H466" class="edge"/>
  <path d="M330,191 H466" class="edge"/>
  <path d="M330,241 H466" class="edge"/>

  <rect x="470" y="20"  width="330" height="38" rx="3" class="layer"/>
  <text x="486" y="45"  class="lab">base image</text>
  <text x="784" y="45"  text-anchor="end" class="size">9.31 MB</text>

  <rect x="470" y="70"  width="330" height="38" rx="3" class="layer"/>
  <text x="486" y="95"  class="lab">/app</text>
  <text x="784" y="95"  text-anchor="end" class="size">8.19 kB</text>

  <rect x="470" y="120" width="330" height="38" rx="3" class="layer"/>
  <text x="486" y="145" class="lab">app.txt</text>
  <text x="784" y="145" text-anchor="end" class="size">12.3 kB</text>

  <rect x="470" y="170" width="330" height="38" rx="3" class="layer"/>
  <text x="486" y="195" class="lab">/data</text>
  <text x="784" y="195" text-anchor="end" class="size">8.19 kB</text>

  <rect x="470" y="220" width="330" height="38" rx="3" class="layer"/>
  <text x="486" y="245" class="lab">start command</text>
  <text x="784" y="245" text-anchor="end" class="size">0 B</text>

  <text x="635" y="285" text-anchor="middle" class="note">one instruction, one read-only layer</text>
</svg>
